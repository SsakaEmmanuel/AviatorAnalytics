name: Android CI

on:
  push:
    branches:
      - main
      - improvements/security-and-ci
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if gradle --no-daemon --no-configuration-cache testDebugUnitTest; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle test attempt $attempt failed; retrying after 20 seconds..."
              sleep 20
            fi
          done
          exit 1

      - name: Assemble debug APK
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if gradle --no-daemon --no-configuration-cache assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "APK assembly attempt $attempt failed; retrying after 20 seconds..."
              sleep 20
            fi
          done
          exit 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AviatorAnalytics-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
